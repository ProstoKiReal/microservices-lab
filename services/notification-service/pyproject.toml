[project]
name = "notification-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ProstoKiReal", email = "n17k17@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "dishka-faststream>=0.7.0",
    "fastapi>=0.163.0",
    "faststream[kafka]>=0.7.8",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
notification-service = "notification_service:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
